<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        h2 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f2f6; }
        .error { color: #c0392b; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>Enterprise Directory Management Terminal</h2>
    <p>Click below to safely stream relational data fetched dynamically via Node.js routing from our foundational Java JDBC infrastructure layer.</p>
    <button onclick="loadEmployees()">Sync Employee Database</button>
    <div id="error-box" class="error"></div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Employee Name</th>
                <th>Role / Designation</th>
                <th>Annual Base Salary</th>
            </tr>
        </thead>
        <tbody id="employee-table-body"></tbody>
    </table>
    <script>
        async function loadEmployees() {
            const tableBody = document.getElementById('employee-table-body');
            const errorBox = document.getElementById('error-box');
            tableBody.innerHTML = ''; 
            errorBox.innerText = '';
            try {
                const response = await fetch('/fetch-employees');
                const data = await response.json();
                if (data.error) {
                    errorBox.innerText = `System Alert: ${data.error}. (${data.details || ''})`;
                    return;
                }
                data.forEach(employee => {
                    const row = `<tr>
                        <td>${employee.id}</td>
                        <td><strong>${employee.name}</strong></td>
                        <td>${employee.role}</td>
                        <td>$${employee.salary.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (err) {
                errorBox.innerText = 'Network Connection Interrupted! Ensure Node and Java are online.';
                console.error(err);
            }
        }
    </script>
</body>
</html>
